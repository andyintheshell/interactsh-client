[package]
name = "interactsh-client"
version = "0.2.4"
edition = "2021"
rust-version = "1.85"
description = "Async Rust client for polling out-of-band interaction servers."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andyintheshell/interactsh-client"
homepage = "https://github.com/andyintheshell/interactsh-client"
documentation = "https://docs.rs/interactsh-client"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>", "andyintheshell"]
keywords = ["oob", "interactsh", "security", "async", "http"]
categories = ["network-programming", "web-programming"]
exclude = ["target/"]

[dependencies]
aes = "=0.8.4"
base64 = "=0.23.1"
ctr = "=0.9.2"
rand = "=0.8.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2", "charset", "json", "stream"] }
rsa = { version = "=0.9.10", features = ["pem"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
guise-choice = "0.1.2"
guise-pacing = "0.1.2"
thiserror = "=2.0.18"
toml = "=0.8.23"
futures-util = "=0.3.32"
# Tokio is required for async backoff/sleep in the library (used by retries/backoff).
tokio = { version = "=1.51.1", features = ["time"] }

[dev-dependencies]
proptest = "=1.9.0"
tempfile = "=3.27.0"
tokio = { version = "=1.51.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
faultkit = "0.2.0"

[[test]]
name = "property"
path = "tests/property/mod.rs"
