[package]
name = "interactsh-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Async Rust client for polling out-of-band interaction servers."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andyintheshell/interactsh-client"
homepage = "https://github.com/andyintheshell/interactsh-client"
documentation = "https://docs.rs/interactsh-client"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>", "andyintheshell"]
keywords = ["oob", "interactsh", "security", "async", "http"]
categories = ["network-programming", "web-programming"]
exclude = ["target/"]

[dependencies]
aes = "=0.9.4"
base64 = "=0.23.1"
ctr = "=0.10.1"
# RSA and the guise crates share rand 0.8's RNG traits.
rand = "=0.8.8"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "charset", "json", "stream"] }
rsa = { version = "=0.9.10", features = ["pem"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Stable rsa 0.9 requires digest 0.10; sha2 0.11 uses incompatible traits.
sha2 = "=0.10.9"
guise-choice = "=0.1.8"
guise-pacing = "=0.1.8"
thiserror = "=2.0.21"
toml = "=1.2.1"
futures-util = "=0.3.34"
# Tokio is required for async backoff/sleep in the library (used by retries/backoff).
tokio = { version = "=1.54.1", features = ["time"] }

[dev-dependencies]
proptest = "=1.12.0"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
faultkit = "=0.2.2"

[[test]]
name = "property"
path = "tests/property/mod.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"
